name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Is this a pre-release?"
        required: false
        type: boolean
        default: false

jobs:
  release:
    uses: builtnorth/.github/.github/workflows/composer-package-release.yml@main
    with:
      package-name: "theme-skin-switcher"
      package-display-name: "Theme Skin Switcher"
      composer-namespace: "kitaris/module-theme-skin-switcher"
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      # Package has no phpunit/phpcs/phpcompat scripts yet.
      composer-repository-profile: from-composer
      run-coverage: false
      run-phpcs: false
      run-phpcompat: false
    permissions:
      contents: write
    secrets: inherit
